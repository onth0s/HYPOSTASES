[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "hypostases"
version = "0.2.0"

description = "Agent-based modeling framework — formal specification and reference implementation"
requires-python = ">=3.11"

license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/onth0s/HYPOSTASES"
Repository = "https://github.com/onth0s/HYPOSTASES"

[project.scripts]
hypostases = "hypostases.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]



[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "RUF002", # ambiguous unicode characters in mathematical docstrings (e.g. σ, ×, ℝ, Δ)
    "RUF003", # ambiguous unicode characters in mathematical comments (e.g. ρ)
]



[tool.ruff.lint.isort]
known-first-party = ["hypostases"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

