# Chess Experiment Pre-Registration Configuration
# Rule 006: Primacy of Data-Driven YAML Approach (Design Philosophy V Pre-Registration)

experiment_id: "chess_dual_testing_grounds_v1"
description: "Pre-registered parameters for Ground A (Self-Play) vs Ground B (Stockfish Benchmark)"

training:
  learning_rate: 0.01
  efe_beta: 0.2
  policy_temperature: 0.8
  min_temperature: 0.20
  feature_basis_k: 9
  initial_priors: "random"
  max_moves_training: 35
  early_adjudication_material: 6.0
  generations: 16
  games_per_generation: 24

ground_a:
  parallel_workers: 20
  snapshot_interval_k: 4
  games_per_pair: 4
  max_moves_eval: 120
  base_elo_anchor: 800.0

ground_b:
  games_per_elo_estimate_n: 30
  eval_last_n_snapshots: 2
  max_moves_eval: 120
  calibration_method: "UCI_Elo"
  stockfish_fixed_level: 800
  time_control_per_move: 0.1
  parallel_workers: 20
  stockfish_threads: 2
  stockfish_path: "src/hypostases/plugins/domains/chess/stockfish.exe"

pre_registration:
  seeds: [42, 101, 202, 303, 404]
  pass_criterion_monotonic_ratio: 0.80
  representation_modes: ["full", "raw"]
